# ============================================================
# Servidor da aplicacao
# ============================================================
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# ============================================================
# Banco de Dados - PostgreSQL (Supabase)
# ============================================================
# Use o Session Pooler do Supabase (porta 5432), que funciona via IPv4.
# A conexao direta (db.<ref>.supabase.co) e somente IPv6 e nao funciona no Render;
# o Transaction Pooler (6543) exigiria prepareThreshold=0 (sem prepared statements).
#   DB_URL=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME=postgres.<project-ref>
#   DB_PASSWORD=<senha do banco no Supabase>
# Local: definidas no .env (carregado pelo DotEnvConfig). Producao: variaveis do Render.
# O driver (org.postgresql.Driver) e o dialeto sao detectados pela URL.
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ============================================================
# Configuracao do JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Tabelas ficam no schema app_luigarah (fora do schema public exposto pela Data API do Supabase)
spring.jpa.properties.hibernate.default_schema=app_luigarah
spring.jpa.open-in-view=false

# ============================================================
# Pool de conexoes (HikariCP)
# ============================================================
spring.datasource.hikari.pool-name=Hikari-Supabase
# Plano free do Supabase tem poucas conexoes no pooler; mantenha o pool pequeno
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
# Queries nativas nao qualificam o schema (ex.: FROM produtos); o search_path resolve.
# Nao e preciso connection-test-query: o driver PostgreSQL usa Connection.isValid()
spring.datasource.hikari.connection-init-sql=SET search_path TO app_luigarah, public

# ============================================================
# Flyway - Migracao de banco de dados
# ============================================================
# Migrations em src/main/resources/db/migration (V1 schema, V2-V4 seeds).
# Nunca edite uma migration ja aplicada: o Flyway valida o checksum e a aplicacao nao sobe.
# Mudancas de banco devem ir em um novo arquivo V5__descricao.sql, V6__..., etc.
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=app_luigarah
spring.flyway.schemas=app_luigarah

# ============================================================
# Swagger / OpenAPI (springdoc)
# ============================================================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.validatorUrl=

# ============================================================
# CORS - Origens permitidas
# ============================================================
app.cors.origens-permitidas=http://localhost:3000,https://luigarah.vercel.app

# ============================================================
# JWT - Autenticacao e Seguranca
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# Logs
# ============================================================
logging.level.com.luigarah=DEBUG

# ============================================================
# Configuracao de upload multipart (limite de tamanho)
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# Email - Brevo SMTP
# ============================================================
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
# Email - Brevo API
# ============================================================
app.brevo.api-key=${BREVO_API_KEY}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:luigarah@gmail.com}
app.brevo.sender-name=${BREVO_SENDER_NAME:Luigarah}

# ============================================================
# Traducao automatica dos produtos (Google Cloud Translation)
# ============================================================
# Chave de API com a "Cloud Translation API" habilitada. Sem ela os produtos
# ficam em portugues em todos os idiomas do site.
app.traducao.google-api-key=${GOOGLE_TRANSLATE_API_KEY:}

# ============================================================
# Email - URLs do Frontend
# ============================================================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.email.verification.expiration=86400000
app.email.reset-password.expiration=3600000

